<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biscoitinho da Sorte</title>
    <style>
      :root {
        --fundo: #fff6e9;
        --texto: #3b2415;
        --suave: #7a5c46;
        --destaque: #b4531a;
        --papel: #ffffff;
        --borda: #ecd9c2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--fundo);
        color: var(--texto);
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }

      main {
        width: 100%;
        max-width: 480px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 7vw, 2.5rem);
      }

      .intro {
        margin: 0 0 16px;
        color: var(--suave);
        font-size: 1.1rem;
        line-height: 1.5;
      }

      .biscoito {
        display: block;
        width: min(260px, 75vw);
        margin: 0 auto;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        animation: balanco 2.6s ease-in-out infinite;
      }

      .biscoito:focus-visible {
        outline: 3px solid var(--destaque);
        outline-offset: 4px;
        border-radius: 12px;
      }

      .biscoito:disabled {
        cursor: default;
        animation: none;
      }

      .biscoito svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .metade {
        transition: transform 0.6s ease, opacity 0.6s ease 0.25s;
        transform-box: fill-box;
        transform-origin: center;
      }

      .aberto .esquerda {
        transform: translate(-18px, 4px) rotate(-12deg);
        opacity: 0.35;
      }

      .aberto .direita {
        transform: translate(18px, 4px) rotate(12deg);
        opacity: 0.35;
      }

      .frase {
        margin: 8px 0 0;
        padding: 18px 20px;
        background: var(--papel);
        border: 1px solid var(--borda);
        border-radius: 6px;
        box-shadow: 0 3px 10px rgba(59, 36, 21, 0.12);
        font-size: 1.3rem;
        line-height: 1.4;
        animation: surgir 0.5s ease both;
      }

      .pix {
        margin-top: 24px;
        animation: surgir 0.5s ease both;
      }

      .pix h2 {
        margin: 0 0 4px;
        font-size: 1.25rem;
      }

      .pix p {
        margin: 0 0 12px;
        color: var(--suave);
        line-height: 1.4;
      }

      .qr {
        display: block;
        width: min(220px, 70vw);
        height: auto;
        margin: 0 auto 12px;
        background: #ffffff;
        border: 1px solid var(--borda);
        border-radius: 6px;
      }

      .acoes {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      .acoes button {
        padding: 10px 16px;
        border: 1px solid var(--destaque);
        border-radius: 6px;
        background: var(--destaque);
        color: #ffffff;
        font: inherit;
        font-size: 1rem;
        cursor: pointer;
      }

      .acoes button.secundario {
        background: transparent;
        color: var(--destaque);
      }

      @keyframes balanco {
        0%,
        100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }

      @keyframes surgir {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .biscoito,
        .frase,
        .pix {
          animation: none;
        }

        .metade {
          transition: none;
        }
      }
    </style>
  </head>

      const PIX =
        "00020126360014br.gov.bcb.pix0114+55919806473365204000053039865802BR5913FABIO RAPHAEL6006BRASIL62070503***6304342D";

      const FRASES = [
        "Um passo pequeno ainda é um passo à frente.",
        "Você já venceu dias que pareciam impossíveis.",
        "Hoje é um bom dia para recomeçar.",
        "A coragem também mora nos dias difíceis.",
        "Respira. Você dá conta de uma coisa de cada vez.",
        "O que é seu está a caminho. Continue andando.",
        "Sua história não termina neste capítulo.",
        "Feito é melhor que perfeito.",
        "Devagar também se chega longe.",
        "Acredite no que você ainda não consegue ver.",
        "Cair faz parte. Levantar é a sua escolha.",
        "Sua força é maior do que o seu medo.",
        "Toda grande jornada começa com uma decisão.",
        "Não desista antes de ver o resultado.",
        "O cansaço passa, o orgulho de ter tentado fica.",
        "Seja gentil com você hoje.",
        "Você não está atrasado. Este é o seu tempo.",
        "Pequenas vitórias também merecem comemoração.",
        "Depois da tempestade, quem resistiu floresce.",
        "A constância vence o talento que desiste.",
        "Faça hoje o que seu futuro vai agradecer.",
        "Você é a prova de que dá para continuar.",
        "Um dia ruim não define a sua vida.",
        "Tenha fé no processo, mesmo sem ver o fim.",
        "O impossível só dura até alguém tentar.",
        "Sua presença faz diferença na vida de alguém.",
        "Não compare o seu começo com o meio de ninguém.",
        "Errar é a prova de que você está tentando.",
        "Hoje, escolha o progresso em vez da perfeição.",
        "O medo avisa. Quem decide é você.",
        "Plante hoje, mesmo sem saber quando vai colher.",
        "Você merece as coisas boas que está buscando.",
        "Descansar também é seguir em frente.",
        "A sua luz não depende da aprovação de ninguém.",
        "Grandes mudanças começam em silêncio.",
        "Continue. Alguém se inspira em você.",
        "O melhor de você ainda está por vir.",
        "Dificuldade é treino para o que você pediu.",
        "Tudo o que você superou virou a sua força.",
        "Coragem não é não ter medo, é ir mesmo assim.",
        "Hoje pode ser o dia em que tudo começa a virar.",
        "Mantenha a cabeça erguida e o coração aberto.",
        "Quem persiste encontra caminhos onde não havia.",
        "Sorria: você chegou até aqui.",
        "A vida responde a quem não para de tentar.",
        "Faça o possível hoje. Amanhã o possível será maior.",
        "Sua calma também é uma forma de poder.",
        "Nenhum esforço sincero é desperdiçado.",
        "Confie: você sabe mais do que imagina.",
        "Vá com medo mesmo, mas vá.",
      ];

      const biscoito = document.getElementById("biscoito");
      const frase = document.getElementById("frase");
      const pix = document.getElementById("pix");
      const copiar = document.getElementById("copiar");
      const outro = document.getElementById("outro");
      let ultima = -1;
      let esperaPix;

      function sortear() {
        let indice;
        do {
          indice = Math.floor(Math.random() * FRASES.length);
        } while (indice === ultima);
        ultima = indice;
        return FRASES[indice];
      }

      biscoito.addEventListener("click", () => {
        biscoito.disabled = true;
        biscoito.classList.add("aberto");
        frase.textContent = sortear();
        frase.hidden = false;
        esperaPix = setTimeout(() => {
          pix.hidden = false;
        }, 1400);
      });

      outro.addEventListener("click", () => {
        clearTimeout(esperaPix);
        pix.hidden = true;
        frase.hidden = true;
        biscoito.classList.remove("aberto");
        biscoito.disabled = false;
        copiar.textContent = "Copiar código Pix";
        biscoito.focus();
      });

      copiar.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(PIX);
          copiar.textContent = "Código copiado!";
        } catch {
          window.prompt("Copie o código Pix:", PIX);
        }
      });
